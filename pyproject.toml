[project]
name = "ai-call-center"
version = "0.1.0"
description = "Voice business card: Telnyx + Pipecat + LangGraph multi-agent phone demo"
readme = "README.md"
authors = [
    { name = "therecluse26", email = "therecluse26@protonmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "certifi>=2026.10.23",
    "fastapi>=0.163.1",
    "fastembed>=0.9.1",
    "jellyfish>=1.3.0",
    "langchain>=1.5.0",
    "langchain-anthropic>=1.7.10",
    "langchain-core>=1.8.0",
    "langchain-google-genai>=4.5.0",
    "langchain-openai>=1.8.0",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "langsmith[pipecat]>=0.14.17",
    "pipecat-ai[aws-nova-sonic,google,openai,runner,silero,tracing,websocket]>=1.16.0",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "telnyx[webhooks]>=4.191.0",
    "typesafe-sdk>=0.7.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
chat = "ai_call_center.chat:main"
serve = "ai_call_center.app:main"
setup-transfer = "ai_call_center.telephony.outbound:main"
test-email = "ai_call_center.test_email:main"
check-nova = "ai_call_center.check_nova:main"
check-jev = "ai_call_center.check_jev:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
