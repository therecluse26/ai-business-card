# A pull request runs four checks before a person merges it. A merge to main deploys (fly-deploy.yml).
#   1. The unit tests. One of them is a dry run of the fix job (tests/test_fix_job.py).
#   2. The scorer: a check that passed on main must not fail on the pull request.
#   3. The formal check of caller memory (.claude/skills/formal-verify-caller-memory/check.py). It takes
#      about 2.5 minutes, so it runs only when a file that it covers changed.
#   4. actionlint: the workflow files have no fault in their YAML, their expressions, or their shell.
#
# The run tests the pull request merged into main as main is now, not the branch alone.
# The four checks are steps of one job, so a run starts one runner only. A failed check does not stop the next one.
#
# The fix job (improve.yml) opens its pull request with the owner's token (IMPROVE_PR_TOKEN), so "opened"
# starts this run at once. With no such token, the fix job uses the token of its own run. GitHub then makes
# the run, and holds it until a person approves it ("Approve workflows to run" on the pull request).
# The fix job opens no draft: each pull request is ready for review, so the checks run when it opens.
#
# A push to main that changes a workflow file runs the same four checks. Such a push has no pull request,
# and a change to improve.yml alone starts no deploy, so no other workflow tests it. The checks run after
# the push: they do not stop it. For a push, the scorer compares the last commit with the commit before it.
# A push to main that changes a file of the formal check runs them too: a commit by hand has no pull
# request, and the check of caller memory guards the data of callers.
#
# The run has no secret, and its token can only read. No check makes a model request.
name: Test a change

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      # The files of the formal check: the coverage record in its SKILL.md, and the check itself.
      - ".claude/skills/formal-verify-caller-memory/**"
      - "src/ai_call_center/graph/tools.py"
      - "src/ai_call_center/passphrase.py"
      - "src/ai_call_center/callers.py"
      - "src/ai_call_center/leads.py"
      - "src/ai_call_center/crm.py"
      - "src/ai_call_center/names.py"
      - "src/ai_call_center/graph/state.py"
      - "src/ai_call_center/agents/specs.py"

# One run at a time for each pull request, and one for main. A new commit stops the run of the commit before it.
# A second run of the same commit waits; it does not stop the first. On 2026-11-22 an approved run and a
# "ready for review" run of one pull request stopped each other, and the pull request showed a failed check.
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event.action == 'synchronize' || github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # the formal check alone can take 5 minutes on a runner
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # this commit and the one before it (for a pull request: main): the scorer compares the two
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - id: sync
        run: uv sync --frozen

      - name: Unit tests
        run: uv run pytest -q

      # Only the word list part of the scorer runs: it makes no model request and gives the same result each time.
      # Before: the code of main, with the test set of the pull request. So the two scores have the same checks,
      # as in the fix job. Some checks fail on main, so the measure is the comparison and not a full pass.
      - name: The scorer must not get worse
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: |
          set -euo pipefail
          git diff --binary HEAD^1 HEAD -- src > "$RUNNER_TEMP/code.patch"
          if [ -s "$RUNNER_TEMP/code.patch" ]; then git apply -R "$RUNNER_TEMP/code.patch"; fi
          before=ok
          uv run score-harness --out "$RUNNER_TEMP/before.json" || before=failed
          if [ -s "$RUNNER_TEMP/code.patch" ]; then git apply "$RUNNER_TEMP/code.patch"; fi
          if [ "$before" = failed ]; then
            # A pull request can change the scorer and the form of the test set together. Then the scorer of main cannot read the new test set.
            echo "::warning::The scorer of main cannot read the test set of this pull request, so the two scores are not compared."
            uv run score-harness
            exit 0
          fi
          uv run score-harness --compare "$RUNNER_TEMP/before.json"

      # The search takes about 2.5 minutes, so it runs only when a file that it covers changed. The list of
      # those files is the coverage record in SKILL.md, so a file added there is covered here too.
      # For a push, the base is the commit before the push, so each commit of the push counts.
      - name: The formal check of caller memory
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        timeout-minutes: 12
        env:
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          set -euo pipefail
          skill=.claude/skills/formal-verify-caller-memory
          base=HEAD^1
          if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
            && git fetch --quiet --no-tags --depth=1 origin "$BEFORE"; then
            base=$BEFORE
          fi
          # The backticks are a part of the pattern in SKILL.md, not a command.
          # shellcheck disable=SC2016
          mapfile -t covered < <(grep -oE '^\| `src/[^`]+`' "$skill/SKILL.md" | sed -E 's/^\| `([^`]+)`/\1/')
          if [ "${#covered[@]}" -eq 0 ]; then
            echo "::warning::SKILL.md lists no covered file, so the check runs."
          elif git diff --quiet "$base" HEAD -- "$skill" "${covered[@]}"; then
            echo "No file of the formal check changed, so it does not run."
            exit 0
          fi
          uv run python "$skill/check.py"

      # The fix job starts only when a real call fails a rule, so a fault in its workflow file shows first in production.
      # The image holds shellcheck, so actionlint also checks each shell script in a `run:` step.
      - name: Check the workflow files
        if: ${{ !cancelled() }}
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
