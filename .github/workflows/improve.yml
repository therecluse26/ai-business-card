# A call that fails a rule of the grader starts this job. Nobody starts it by hand.
#
# The phone server sends a fix request (src/ai_call_center/improve.py): the rule, the agent at fault,
# a cause code, the harness version, two counts, and a fault report. Each name is a word from a fixed
# list in grading.py. The fault report says what went wrong in the call, with each private word removed
# by code on the server (src/ai_call_center/fault_report.py). The job has no transcript.
#
# Three jobs, so the coding agent never has a token that can write:
#   change   the agent changes one prompt or one word list. Its token can only read. The change
#            leaves this job as a patch.
#   measure  code that the agent cannot edit checks the patch, runs the tests, and runs the scorer
#            before the change and after it. Then it pushes the change as a branch.
#   open     opens the pull request with the evidence. This runner never ran the agent's change,
#            so the owner's token (IMPROVE_PR_TOKEN) is safe here.
#            A person reviews the pull request. A merge to main deploys (fly-deploy.yml).
#
# Needs:
#   - one repository secret for the coding agent:
#       CLAUDE_CODE_OAUTH_TOKEN  a Claude subscription pays. Make it with `claude setup-token`.
#       ANTHROPIC_API_KEY        the API account pays.
#     With both, the subscription pays for the coding agent, and the API key pays for the scorer.
#     With no ANTHROPIC_API_KEY, the scorer runs no made-up call: its models need an API key.
#   - Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests"
#   - a repository secret for the pull request, so that its checks start with no approval:
#       IMPROVE_PR_TOKEN         a fine-grained personal access token of the owner, for this repository
#                                only, with "Pull requests: Read and write" and nothing else.
#     GitHub holds each workflow run of a pull request that the token of a job opened, until a person
#     approves the run (GitHub changelog, 2026-05-21). A pull request that the owner's token opened has
#     no such hold. With no such secret, or when it is not valid any more, the job's own token opens the
#     pull request, and a person approves the run of the checks (test.yml).
# Optional repository variables:
#   - IMPROVE_MODEL        the model of the coding agent (default: claude-opus-5-5)
#   - IMPROVE_SCORE_CALLS  "all" (default): the scorer runs each made-up call, before and after.
#                          "new": only the made-up call that the agent added. "none": the word list only.
#                          The made-up calls are model requests that cost money.
#   - OWNER_NAME           the owner's name, as the agents say it
name: Propose a fix for a failed rule

on:
  workflow_dispatch:
    inputs:
      rule:
        description: "The key of the failed rule (grading.py)"
        required: true
        type: string
      agent:
        description: "The agent at fault; empty when the grader named none"
        required: false
        default: ""
        type: string
      cause:
        description: "A cause code of the rule, or other"
        required: true
        default: "other"
        type: string
      version:
        description: "The harness version of the call (a git commit)"
        required: true
        type: string
      failed_calls:
        description: "Graded calls at this version that failed the rule"
        required: false
        default: "1"
        type: string
      graded_calls:
        description: "Graded calls at this version where the rule applied"
        required: false
        default: "1"
        type: string
      happened:
        description: "Fault report: what the caller wanted and what the agent did (no private word)"
        required: false
        default: ""
        type: string
      agent_said:
        description: "Fault report: one sentence of an agent that shows the fault"
        required: false
        default: ""
        type: string
      expected:
        description: "Fault report: what the agent had to do"
        required: false
        default: ""
        type: string

# One proposal at a time. A second fix request waits; it does not stop the first.
concurrency:
  group: improve
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The inputs go to the steps as environment values, never as text inside a command.
  FIX_RULE: ${{ inputs.rule }}
  FIX_AGENT: ${{ inputs.agent }}
  FIX_CAUSE: ${{ inputs.cause }}
  FIX_VERSION: ${{ inputs.version }}
  FIX_FAILED_CALLS: ${{ inputs.failed_calls }}
  FIX_GRADED_CALLS: ${{ inputs.graded_calls }}
  FIX_HAPPENED: ${{ inputs.happened }}
  FIX_AGENT_SAID: ${{ inputs.agent_said }}
  FIX_EXPECTED: ${{ inputs.expected }}
  OWNER_NAME: ${{ vars.OWNER_NAME }}

jobs:
  change:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
      answer: ${{ steps.agent.outputs.structured_output }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the agent reads what changed after the version of the call
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen

      - name: Check the fix request and write the task
        id: task
        run: |
          uv run proposal task --out "$RUNNER_TEMP/task.md" >> "$GITHUB_STEP_SUMMARY"
          {
            echo 'text<<END_OF_TASK_7c1e52'
            cat "$RUNNER_TEMP/task.md"
            echo
            echo 'END_OF_TASK_7c1e52'
            echo "schema=$(uv run proposal schema)"
          } >> "$GITHUB_OUTPUT"

      # A secret with a fault gives "Not logged in" much later, with no reason. This step says the fault at once.
      # A token that was copied from a terminal can hold a line break or a space. A token has no white space,
      # so the step removes it. It prints the length of the token and never the token.
      - name: Check the login of the coding agent
        id: login
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$TOKEN" ] && [ -z "$KEY" ]; then
            echo "::error::No login for the coding agent. Add the repository secret CLAUDE_CODE_OAUTH_TOKEN (from 'claude setup-token') or ANTHROPIC_API_KEY."
            exit 1
          fi
          if [ -z "$TOKEN" ]; then echo "The coding agent uses ANTHROPIC_API_KEY."; exit 0; fi
          clean="$(printf '%s' "$TOKEN" | tr -d '[:space:]')"
          if [ "${#clean}" -lt 40 ]; then
            echo "::error::The secret CLAUDE_CODE_OAUTH_TOKEN is not a token: ${#TOKEN} characters, ${#clean} of them not white space. Run 'claude setup-token' and set the secret again."
            exit 1
          fi
          echo "::add-mask::$clean"
          if [ "${#clean}" != "${#TOKEN}" ]; then
            echo "::warning::The secret CLAUDE_CODE_OAUTH_TOKEN holds $(( ${#TOKEN} - ${#clean} )) white space character(s). The job removed them. Set the secret again, with the token on one line, to end this warning."
          fi
          echo "token=$clean" >> "$GITHUB_OUTPUT"
          case "$clean" in
            sk-ant-oat*) echo "The coding agent uses the subscription token (${#clean} characters, the expected start)." ;;
            *) echo "::warning::The secret CLAUDE_CODE_OAUTH_TOKEN does not start with sk-ant-oat. A token from 'claude setup-token' does." ;;
          esac
      - name: The coding agent makes one change
        id: agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ steps.login.outputs.token }}
          # Claude Code uses an API key before a subscription token. So the key is given only when there is no token.
          anthropic_api_key: ${{ !secrets.CLAUDE_CODE_OAUTH_TOKEN && secrets.ANTHROPIC_API_KEY || '' }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.task.outputs.text }}
          claude_args: |
            --model ${{ vars.IMPROVE_MODEL || 'claude-opus-5-5' }}
            --max-turns 40
            --permission-mode acceptEdits
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(uv run pytest:*),Bash(uv run score-harness),Bash(git log:*),Bash(git diff:*),Bash(git show:*)"
            --disallowedTools "WebFetch,WebSearch"
            --json-schema '${{ steps.task.outputs.schema }}'

      # The action hides what the coding agent printed. This step shows only the end result: the error text of a
      # refused login or a reached usage limit is there. It holds no secret.
      - name: Why the coding agent failed
        if: failure() && steps.agent.conclusion == 'failure'
        run: |
          file="$RUNNER_TEMP/claude-execution-output.json"
          if [ ! -f "$file" ]; then echo "The coding agent wrote no output file." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          jq -rs 'flatten | .[] | if .type == "result" then "result: \(.subtype), error: \(.is_error), turns: \(.num_turns)\n\((.result // "") | tostring | .[0:800])" elif (.type == "assistant" and .error != null) then "error of the model request: \(.error)" else empty end' "$file" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Make a patch of the change
        id: patch
        run: |
          # Only src, tests and evals go into the patch. The next job refuses a file that the agent must not change.
          git add -A -- src tests evals
          git diff --cached --binary HEAD > "$RUNNER_TEMP/change.patch"
          if [ -s "$RUNNER_TEMP/change.patch" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Nothing to propose
        if: steps.patch.outputs.changed != 'true'
        run: echo "The coding agent changed nothing, so there is no pull request." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.patch.outputs.changed == 'true'
        with:
          name: change
          path: ${{ runner.temp }}/change.patch
          retention-days: 14

  measure:
    needs: change
    if: needs.change.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      branch: ${{ steps.push.outputs.branch }}
      title: ${{ steps.body.outputs.title }}
      verdict: ${{ steps.body.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }} # the same commit that the agent changed
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - uses: actions/download-artifact@v4
        with:
          name: change
          path: ${{ runner.temp }}

      - name: Check the patch, then apply it
        id: guard
        run: uv run proposal guard --patch "$RUNNER_TEMP/change.patch"

      - name: Unit tests
        run: uv run pytest -q

      - name: Score before the change and after it
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCORE_CALLS: ${{ vars.IMPROVE_SCORE_CALLS || 'all' }}
          NEW_CALLS: ${{ steps.guard.outputs.new_calls }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ] && [ "$SCORE_CALLS" != "none" ]; then
            echo "No secret ANTHROPIC_API_KEY, so the scorer ran no made-up call. The scores are from the code checks only." >> "$GITHUB_STEP_SUMMARY"
            SCORE_CALLS=none
          fi
          flags=()
          case "$SCORE_CALLS" in
            all) flags+=(--calls) ;;
            new)
              if [ -n "$NEW_CALLS" ]; then
                flags+=(--calls)
                for id in $NEW_CALLS; do flags+=(--only "$id"); done
              fi ;;
            none) ;;
            *) echo "IMPROVE_SCORE_CALLS must be all, new or none"; exit 1 ;;
          esac
          # Before: the old prompts and word lists, with the new made-up call. So the two scores have the same checks.
          git diff HEAD -- src tests > "$RUNNER_TEMP/code.patch"
          if [ -s "$RUNNER_TEMP/code.patch" ]; then git apply -R "$RUNNER_TEMP/code.patch"; fi
          uv run score-harness "${flags[@]}" --out "$RUNNER_TEMP/before.json"
          if [ -s "$RUNNER_TEMP/code.patch" ]; then git apply "$RUNNER_TEMP/code.patch"; fi
          uv run score-harness "${flags[@]}" --out "$RUNNER_TEMP/after.json"

      - name: Write the pull request text
        id: body
        env:
          AGENT_ANSWER: ${{ needs.change.outputs.answer }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          uv run proposal body --before "$RUNNER_TEMP/before.json" --after "$RUNNER_TEMP/after.json" --out "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: The score got worse, so there is no pull request
        if: steps.body.outputs.verdict == 'worse'
        run: echo "A check that passed before the change now fails. The job opens no pull request." >> "$GITHUB_STEP_SUMMARY"

      - name: Push the change as a branch
        id: push
        if: steps.body.outputs.verdict != 'worse'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.body.outputs.title }}
        run: |
          set -euo pipefail
          branch="improve/${FIX_RULE}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A -- src tests evals
          git commit -m "$TITLE" -m "A fix request for the rule ${FIX_RULE} (agent: ${FIX_AGENT:-not known}, cause: ${FIX_CAUSE}). The pull request holds the evidence."
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.push.outputs.branch != ''
        with:
          name: pull-request
          path: ${{ runner.temp }}/body.md
          retention-days: 14

  # A job of its own: this runner ran no line of the agent's change, so nothing here can read the owner's token.
  open:
    needs: measure
    if: needs.measure.outputs.branch != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pull-request
          path: ${{ runner.temp }}

      - name: Open the pull request
        env:
          OWNER_TOKEN: ${{ secrets.IMPROVE_PR_TOKEN }}
          JOB_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.measure.outputs.branch }}
          TITLE: ${{ needs.measure.outputs.title }}
          VERDICT: ${{ needs.measure.outputs.verdict }}
        run: |
          set -euo pipefail
          # A change that the scorer does not show is a draft: a person must judge it with no measure.
          draft=false
          if [ "$VERDICT" != "better" ]; then draft=true; fi
          open_as() {
            GH_TOKEN="$1" gh api "repos/${GITHUB_REPOSITORY}/pulls" --method POST \
              -f title="$TITLE" -f head="$BRANCH" -f base="$GITHUB_REF_NAME" -F body=@"$RUNNER_TEMP/body.md" -F draft="$draft" --jq .html_url
          }
          # The owner's token first: GitHub starts the checks of such a pull request with no approval.
          if [ -n "${OWNER_TOKEN:-}" ]; then
            if open_as "$OWNER_TOKEN" >> "$GITHUB_STEP_SUMMARY"; then exit 0; fi
            echo "::warning::The secret IMPROVE_PR_TOKEN did not open the pull request. Make a new token if it is not valid any more. The job's own token opens the pull request now, so a person must approve the run of its checks."
          else
            echo "::notice::There is no secret IMPROVE_PR_TOKEN, so the job's own token opens the pull request. A person must approve the run of its checks."
          fi
          open_as "$JOB_TOKEN" >> "$GITHUB_STEP_SUMMARY"
