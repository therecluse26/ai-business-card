# A coding agent proposes one change, and code measures it. Nobody starts this job by hand. Two things start it:
#
# 1. A call that fails a rule of the grader. The phone server sends a fix request
#    (src/ai_call_center/improve.py): the rule, the agent at fault, a cause code, the harness version, two
#    counts, and a fault report. Each name is a word from a fixed list in grading.py. The fault report says
#    what went wrong in the call, with each private word removed by code on the server
#    (src/ai_call_center/fault_report.py). The job has no transcript.
# 2. A GitHub issue, by its label (issues.yml, src/ai_call_center/issue_queue.py). The input `issue` names
#    it. The label `auto-fix` gives the scope `prompts`: the job is the same as for a failed rule. The
#    label `auto-build` (the triage agent) or `build` (the owner) gives the scope `code`: the agent can change the code of the phone line, but not
#    the code that measures or judges a change (CODE_REFUSED in proposal.py), no workflow, and no
#    dependency.
#    The job reads the issue itself, and code checks it: the owner of the repository is its author, and it
#    has the label for the scope. So a person who dispatches this workflow with a number gets no more than
#    the labels allow.
#
# Six jobs, so the coding agent never has a token that can write:
#   try1     one try of the coding agent: the jobs `change`, `baseline` and `measure` of improve-try.yml.
#            change   the agent makes one change. Its token can only read. The change leaves this job as a patch.
#            baseline at the same time, on clean code: the "before" result of the existing made-up calls.
#                     It uses a stored result of the same code state, or it runs the calls and stores the result.
#            measure  code that the agent cannot edit checks the patch, runs the new tests on the old code,
#                     runs the tests, and runs the scorer before the change and after it.
#   decide   code reads the result of the first try and decides on a second try (`proposal retry`).
#            Yes: the guard, the unit tests or the formal check failed, the score got worse, the scorer
#            did not show a change of prompts, or no new test of a change of code fails on the old code.
#   try2     the second try: the same task, a section on the first try, and a checkout with the first
#            change in place. Never a third try.
#   push     code picks the try for the pull request (`proposal winner`), checks its patch again, and
#            pushes it as a branch. This runner runs no line of the agent's change.
#   open     opens the pull request with the evidence. This runner never ran the agent's change,
#            so the owner's token (IMPROVE_PR_TOKEN) is safe here.
#            A person reviews the pull request. A merge to main deploys (fly-deploy.yml).
#   report   when the job opened no pull request, it says why, for each try. For an issue: a comment on
#            the issue, and the issue goes back to the label `needs-owner`. For a failed rule: an issue for
#            the rule (one issue for each rule, with the label `needs-owner`), or a comment on it when it
#            is open. This runner ran no line of the agent's change.
#
# Cost: a second try can double the paid scorer calls and the coding agent's usage. IMPROVE_TRIES=1 turns it off.
#
# Needs:
#   - one repository secret for the coding agent:
#       CLAUDE_CODE_OAUTH_TOKEN  a Claude subscription pays. Make it with `claude setup-token`.
#       ANTHROPIC_API_KEY        the API account pays.
#     With both, the subscription pays for the coding agent, and the API key pays for the scorer.
#     With no ANTHROPIC_API_KEY, the scorer runs no made-up call: its models need an API key.
#   - Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests"
#   - a repository secret for the pull request, so that its checks start with no approval:
#       IMPROVE_PR_TOKEN         a fine-grained personal access token of the owner, for this repository
#                                only, with "Pull requests: Read and write" and nothing else.
#     GitHub holds each workflow run of a pull request that the token of a job opened, until a person
#     approves the run (GitHub changelog, 2026-05-21). A pull request that the owner's token opened has
#     no such hold. With no such secret, or when it is not valid any more, the job's own token opens the
#     pull request, and a person approves the run of the checks (test.yml).
# Optional:
#   - a repository secret for the stored "before" result of the existing made-up calls:
#       IMPROVE_BASELINE_SALT    a random text, for example from `openssl rand -hex 32`. Only three steps of
#                                the job `baseline` get it, and no code of the agent runs in that job.
#     The job `baseline` keeps its result as a signed file in a run artifact, for 30 days. The signature is an
#     HMAC with the salt, of the code state and of the file. The code of the agent can upload an artifact with
#     the same name, but it cannot sign it. The job ignores a file with a bad signature and runs the calls.
#     With the salt, and with IMPROVE_SCORE_CALLS=all, the run of the existing made-up calls on the old code is
#     paid one time for each code state: try 2, and each later fix job at the same code state, use the stored
#     result. With no salt, nothing is stored, and each try runs each made-up call before the change.
#     A limit: one stored run is the "before" result of each fix job until the code state changes. The runs
#     again of a changed check are fresh on both sides, and they limit that.
# Optional repository variables:
#   - IMPROVE_MODEL        the model of the coding agent (default: claude-opus-5-5)
#   - BUILD_MODEL          the model of the coding agent for the scope `code` (default: IMPROVE_MODEL)
#   - IMPROVE_SCORE_CALLS  "all" (default): the scorer runs each made-up call, before and after.
#                          "new": only the made-up call that the agent added. "none": the word list only.
#                          The made-up calls are model requests that cost money. A call with a
#                          changed check runs 2 more times on each side. Only "all" uses a stored result.
#   - IMPROVE_SCORE_MODEL  the model of the agents in a made-up call (default: anthropic:claude-haiku-5-5).
#                          It is small on purpose, like the voice models of a real call. A large model
#                          costs about 40 times more: about 3 dollars for one scorer run on claude-opus-5-5.
#   - IMPROVE_TRIES        2 (default): a second try when the first falls short. 1: one try only.
#                          The second try runs the agent and the scorer again, so it can double their cost.
#   - OWNER_NAME           the owner's name, as the agents say it
name: Propose a fix for a failed rule
# The queue finds the runs of one issue by this name (FIX_RUN in issue_queue.py). It puts an issue back
# after a closed pull request only when no run for that issue is still going.
run-name: "${{ inputs.issue != '' && format('Issue #{0} ({1})', inputs.issue, inputs.scope == 'code' && 'build' || 'auto-fix') || format('Rule {0}', inputs.rule) }}"

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "The number of a GitHub issue. Empty for a failed rule: then the inputs below say what failed"
        required: false
        default: ""
        type: string
      scope:
        description: "For an issue: what the agent can change. prompts needs the label auto-fix; code needs the label build"
        required: false
        default: "prompts"
        type: choice
        options: [prompts, code]
      rule:
        description: "The key of the failed rule (grading.py)"
        required: false
        default: ""
        type: string
      agent:
        description: "The agent at fault; empty when the grader named none"
        required: false
        default: ""
        type: string
      cause:
        description: "A cause code of the rule, or other"
        required: false
        default: "other"
        type: string
      version:
        description: "The harness version of the call (a git commit)"
        required: false
        default: ""
        type: string
      failed_calls:
        description: "Graded calls at this version that failed the rule"
        required: false
        default: "1"
        type: string
      graded_calls:
        description: "Graded calls at this version where the rule applied"
        required: false
        default: "1"
        type: string
      happened:
        description: "Fault report: what the caller wanted and what the agent did (no private word)"
        required: false
        default: ""
        type: string
      agent_said:
        description: "Fault report: one sentence of an agent that shows the fault"
        required: false
        default: ""
        type: string
      expected:
        description: "Fault report: what the agent had to do"
        required: false
        default: ""
        type: string

# One proposal at a time for the failed rules, and one for each issue. A second fix request waits; it does
# not stop the first. Each issue has a group of its own: GitHub keeps only one waiting run in a group, so
# in one group for all, a third run would remove the second.
concurrency:
  group: improve${{ inputs.issue != '' && format('-issue-{0}', inputs.issue) || '' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The inputs go to the steps as environment values, never as text inside a command.
  FIX_ISSUE: ${{ inputs.issue }}
  FIX_SCOPE: ${{ inputs.issue != '' && inputs.scope || 'prompts' }} # a failed rule always has the scope prompts
  FIX_RULE: ${{ inputs.rule }}
  FIX_AGENT: ${{ inputs.agent }}
  FIX_CAUSE: ${{ inputs.cause }}
  FIX_VERSION: ${{ inputs.version }}
  FIX_FAILED_CALLS: ${{ inputs.failed_calls }}
  FIX_GRADED_CALLS: ${{ inputs.graded_calls }}
  FIX_HAPPENED: ${{ inputs.happened }}
  FIX_AGENT_SAID: ${{ inputs.agent_said }}
  FIX_EXPECTED: ${{ inputs.expected }}
  OWNER_NAME: ${{ vars.OWNER_NAME }}

jobs:
  # The two tries run the same jobs from one file, so that they cannot drift apart. The caller's `env` does
  # not reach a called workflow: the inputs of the dispatch go as one JSON text, and only the three named secrets.
  try1:
    uses: ./.github/workflows/improve-try.yml
    permissions:
      contents: read
      issues: read
      pull-requests: read # the earlier proposals for the same rule or issue
      actions: read # only the job `baseline` uses it: it lists and downloads the artifacts of the stored result
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      IMPROVE_BASELINE_SALT: ${{ secrets.IMPROVE_BASELINE_SALT }}
    with:
      try: 1
      request: ${{ toJSON(inputs) }}

  # Code decides, on a runner that ran no line of the agent's change. The outputs of the first try come from
  # a runner that did, so `proposal retry` takes only a word from a fixed list from each.
  decide:
    needs: try1
    if: ${{ !cancelled() && needs.try1.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      again: ${{ steps.retry.outputs.again }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # The uv cache stays on here: this job has no secret and no write permission.
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: Decide on a second try
        id: retry
        env:
          JOBS: ${{ toJSON(needs) }}
          TRIES: ${{ vars.IMPROVE_TRIES }}
        run: uv run proposal retry >> "$GITHUB_STEP_SUMMARY"

  try2:
    needs: [try1, decide]
    if: ${{ !cancelled() && needs.decide.outputs.again == 'true' }}
    uses: ./.github/workflows/improve-try.yml
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      IMPROVE_BASELINE_SALT: ${{ secrets.IMPROVE_BASELINE_SALT }}
    with:
      try: 2
      request: ${{ toJSON(inputs) }}
      first: ${{ toJSON(needs.try1.outputs) }}

  # Only the winning try is pushed. This runner runs no line of the agent's change: `proposal guard` imports
  # each module before it applies the patch, and after the patch only git runs. No test, no scorer.
  push:
    needs: [try1, decide, try2]
    if: ${{ !cancelled() && (needs.try1.outputs.finished == 'true' || needs.try2.outputs.finished == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
    outputs:
      branch: ${{ steps.push.outputs.branch }}
      title: ${{ steps.winner.outputs.title }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }} # the same commit that both tries changed
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false # a secret or a write permission: no cache, because other code can write an entry
      - run: uv sync --frozen

      # The runners of the tries ran the agent's commands, so this job reads the issue again from GitHub.
      - name: Read the issue
        if: inputs.issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$FIX_ISSUE" in *[!0-9]*) echo "::error::The input issue is not a number."; exit 1 ;; esac
          gh api "repos/${GITHUB_REPOSITORY}/issues/${FIX_ISSUE}" > "$RUNNER_TEMP/issue.json"
          echo "FIX_ISSUE_FILE=$RUNNER_TEMP/issue.json" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          pattern: "*-[12]" # change-1, measure-1, change-2, measure-2: one folder each
          path: ${{ runner.temp }}/tries

      # `better` beats `same`; then, for the scope `code`, a new test that fails on the old code; a tie goes
      # to the second try. The text of the pull request says which try it is, and what became of the other.
      - name: Pick the try for the pull request
        id: winner
        env:
          JOBS: ${{ toJSON(needs) }}
          TRIES: ${{ vars.IMPROVE_TRIES }}
        run: uv run proposal winner --tries "$RUNNER_TEMP/tries" --patch "$RUNNER_TEMP/change.patch" --body "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"

      # The same checks as in the job `measure`: its runner ran the agent's change, so its result is not proof.
      - name: Check the patch, then apply it
        id: guard
        if: steps.winner.outputs.try != ''
        run: uv run proposal guard --patch "$RUNNER_TEMP/change.patch"

      - name: Push the change as a branch
        id: push
        if: steps.winner.outputs.try != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.winner.outputs.title }}
          TRY: ${{ steps.winner.outputs.try }}
        run: |
          set -euo pipefail
          if [ -n "$FIX_ISSUE" ]; then
            branch="improve/issue-${FIX_ISSUE}-${GITHUB_RUN_ID}"
            why="A change for issue #${FIX_ISSUE} (scope: ${FIX_SCOPE}), from try ${TRY} of the coding agent. The pull request holds the evidence."
          else
            branch="improve/${FIX_RULE}-${GITHUB_RUN_ID}"
            why="A fix request for the rule ${FIX_RULE} (agent: ${FIX_AGENT:-not known}, cause: ${FIX_CAUSE}), from try ${TRY} of the coding agent. The pull request holds the evidence."
          fi
          paths=(src tests evals)
          if [ "$FIX_SCOPE" = code ]; then paths+=(README.md); fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A -- "${paths[@]}"
          git commit -m "$TITLE" -m "$why"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        if: steps.push.outputs.branch != ''
        with:
          name: pull-request
          path: ${{ runner.temp }}/body.md
          retention-days: 14

  # A job of its own: this runner ran no line of the agent's change, so nothing here can read the owner's token.
  # `!cancelled()` is necessary: with no status function, GitHub skips this job each time that a job before `push`
  # was skipped. The job `try2` is skipped in each run with one try, so no such run opened a pull request.
  open:
    needs: push
    if: ${{ !cancelled() && needs.push.result == 'success' && needs.push.outputs.branch != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pull-request
          path: ${{ runner.temp }}

      - name: Open the pull request
        env:
          OWNER_TOKEN: ${{ secrets.IMPROVE_PR_TOKEN }}
          JOB_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.push.outputs.branch }}
          TITLE: ${{ needs.push.outputs.title }}
        run: |
          set -euo pipefail
          # No pull request is a draft (the owner's rule, 2026-11-23): each one is ready for review, and its
          # checks run at once. The text of the pull request says what the scorer shows and what it does not.
          open_as() {
            GH_TOKEN="$1" gh api "repos/${GITHUB_REPOSITORY}/pulls" --method POST \
              -f title="$TITLE" -f head="$BRANCH" -f base="$GITHUB_REF_NAME" -F body=@"$RUNNER_TEMP/body.md" -F draft=false --jq .html_url
          }
          # The owner's token first: GitHub starts the checks of such a pull request with no approval.
          if [ -n "${OWNER_TOKEN:-}" ]; then
            if open_as "$OWNER_TOKEN" >> "$GITHUB_STEP_SUMMARY"; then exit 0; fi
            echo "::warning::The secret IMPROVE_PR_TOKEN did not open the pull request. Make a new token if it is not valid any more. The job's own token opens the pull request now, so a person must approve the run of its checks."
          else
            echo "::notice::There is no secret IMPROVE_PR_TOKEN, so the job's own token opens the pull request. A person must approve the run of its checks."
          fi
          open_as "$JOB_TOKEN" >> "$GITHUB_STEP_SUMMARY"

  # When the job opened no pull request. An issue must not stay in "a job started" for ever. A failed rule
  # gets no second fix request at this harness version, so without a trace its reason is only in this run.
  # `toJSON(needs)` gives code the result and the outputs of each job before this one, as one value.
  report:
    needs: [try1, decide, try2, push, open]
    if: always() && (inputs.issue != '' || inputs.rule != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false # a secret or a write permission: no cache, because other code can write an entry
      - run: uv sync --frozen

      - name: Write why there is no pull request
        if: inputs.issue != ''
        id: report
        env:
          JOBS: ${{ toJSON(needs) }}
          TRIES: ${{ vars.IMPROVE_TRIES }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: uv run issue-queue report --out "$RUNNER_TEMP/report.md"

      - name: Say it on the issue, and put the issue back to the owner
        if: steps.report.outputs.opened == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$FIX_ISSUE" in *[!0-9]*) echo "::error::The input issue is not a number."; exit 1 ;; esac
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          labels="repos/${GITHUB_REPOSITORY}/issues/${FIX_ISSUE}/labels"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${FIX_ISSUE}/comments" --method POST -F body=@"$RUNNER_TEMP/report.md" --silent
          gh api "$labels" --method POST -f "labels[]=needs-owner" --silent
          # Each label that starts a job goes, as the queue's verb `clear` does (issues.yml). So no job starts
          # again by itself. A label that the issue does not have gives an error, and that is fine.
          for label in auto-fix auto-build build; do gh api "$labels/$label" --method DELETE --silent || true; done
          gh api "$labels/fix-started" --method DELETE --silent || true

      # The open issues, so that the trace of a rule goes on its open issue and not on a new one each time.
      # With --slurp, more than one page is still one JSON value: a list of pages.
      - name: Read the open issues
        if: inputs.issue == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" > "$RUNNER_TEMP/open-issues.json"

      # `proposal report` checks each input again with the checks of `proposal task`, before any of it is shown.
      - name: Write why there is no pull request for the rule
        if: inputs.issue == ''
        id: trace
        env:
          JOBS: ${{ toJSON(needs) }}
          TRIES: ${{ vars.IMPROVE_TRIES }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: uv run proposal report --issues "$RUNNER_TEMP/open-issues.json" --out "$RUNNER_TEMP/trace.md"

      # The job's token writes the issue, so its author is the bot of GitHub Actions. The queue starts no job
      # for an issue that the owner did not write (issue_queue.py), so the trace only waits for the owner.
      - name: Leave a trace in the issue for the rule
        if: steps.trace.outputs.opened == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.trace.outputs.title }}
          ISSUE: ${{ steps.trace.outputs.issue }}
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/trace.md" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$ISSUE" ]; then
            case "$ISSUE" in *[!0-9]*) echo "::error::The number of the issue is not a number."; exit 1 ;; esac
            gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/comments" --method POST -F body=@"$RUNNER_TEMP/trace.md" --silent
            gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/labels" --method POST -f "labels[]=needs-owner" --silent
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues" --method POST -f title="$TITLE" -F body=@"$RUNNER_TEMP/trace.md" -f "labels[]=needs-owner" --silent
          fi
