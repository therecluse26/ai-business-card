# One try of the coding agent: the jobs `change`, `baseline` and `measure` of the fix job. Only improve.yml calls this file.
#
# improve.yml calls it one time, or two times: the second try gets the result of the first.
#   change    the agent makes one change. Its token can only read. The change leaves this job as a patch.
#             The task names the earlier pull requests for the same rule or issue, and what became of them.
#             A second try starts from the first change. `.first-try/` holds the first patch and what the
#             measure showed (`proposal first-try`). The patch never holds that folder.
#   baseline  at the same time as `change`: the "before" result of the existing made-up calls, on clean code.
#             It runs only with IMPROVE_SCORE_CALLS=all, the API key, and the salt IMPROVE_BASELINE_SALT.
#             It uses a stored result of the same code state. Else it runs the calls and stores the result.
#             The stored result is a signed file in a run artifact, for 30 days. A file with a bad signature is ignored.
#   measure   code that the agent cannot edit checks the patch, runs the new tests on the old code, runs
#             the tests, and runs the scorer before the change and after it. With a result of `baseline`,
#             the run before the change takes only the new made-up calls and the word list. A made-up call
#             with a changed check runs 2 more times on each side. It pushes nothing: the job `push` of
#             improve.yml pushes the change of the winning try.
#
# A called workflow gets none of the caller's `env`. So the inputs of the dispatch come as one JSON text.
# Only the two secrets of the coding agent and the scorer, and the salt of the job `baseline`, come in.
# IMPROVE_PR_TOKEN never does.
# The permissions of the caller's job cap the permissions here, and each job here can only read.
# The artifacts of a try have its number (change-1, measure-1), because the run of improve.yml holds both tries.
# The job `baseline` gives its result to `measure` as job outputs. Its stored result is an artifact `baseline-store-...`.
name: One try of the coding agent

on:
  workflow_call:
    inputs:
      try:
        description: "1 or 2: which try of the coding agent this is"
        required: true
        type: number
      request:
        description: "The inputs of the dispatch of improve.yml, as one JSON text"
        required: true
        type: string
      first:
        description: "For the second try: the outputs of the first try, as one JSON text. A runner that ran the first change wrote them"
        required: false
        default: ""
        type: string
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      # Only three steps of the job `baseline` read it. No code of the agent runs in that job.
      IMPROVE_BASELINE_SALT:
        required: false
    # A runner that ran the agent's change wrote each output of `measure`. The code that reads them
    # (`proposal retry`, `proposal winner`, `proposal report`) takes only a word from a fixed list.
    outputs:
      changed:
        description: "true, false, or empty when the job change stopped before its patch"
        value: ${{ jobs.change.outputs.changed }}
      answer:
        description: "The coding agent's last answer, as JSON"
        value: ${{ jobs.change.outputs.answer }}
      finished:
        description: "true when the job measure wrote the pull request text"
        value: ${{ jobs.measure.outputs.finished }}
      verdict:
        description: "better, same or worse"
        value: ${{ jobs.measure.outputs.verdict }}
      calls:
        description: "true when the made-up calls ran"
        value: ${{ jobs.measure.outputs.calls }}
      red:
        description: "red, not-red or no-test: did a new or changed test fail on the old code"
        value: ${{ jobs.measure.outputs.red }}
      guard:
        description: "The result of the guard"
        value: ${{ jobs.measure.outputs.guard }}
      proof:
        description: "The result of the proof on the old code"
        value: ${{ jobs.measure.outputs.proof }}
      tests:
        description: "The result of the unit tests"
        value: ${{ jobs.measure.outputs.tests }}
      formal:
        description: "The result of the formal check of caller memory (the scope code only)"
        value: ${{ jobs.measure.outputs.formal }}
      score:
        description: "The result of the scorer"
        value: ${{ jobs.measure.outputs.score }}

permissions:
  contents: read

env:
  # The inputs go to the steps as environment values, never as text inside a command.
  FIX_TRY: ${{ inputs.try }}
  FIX_ISSUE: ${{ fromJSON(inputs.request).issue }}
  FIX_SCOPE: ${{ fromJSON(inputs.request).issue != '' && fromJSON(inputs.request).scope || 'prompts' }} # a failed rule always has the scope prompts
  FIX_RULE: ${{ fromJSON(inputs.request).rule }}
  FIX_AGENT: ${{ fromJSON(inputs.request).agent }}
  FIX_CAUSE: ${{ fromJSON(inputs.request).cause }}
  FIX_VERSION: ${{ fromJSON(inputs.request).version }}
  FIX_FAILED_CALLS: ${{ fromJSON(inputs.request).failed_calls }}
  FIX_GRADED_CALLS: ${{ fromJSON(inputs.request).graded_calls }}
  FIX_HAPPENED: ${{ fromJSON(inputs.request).happened }}
  FIX_AGENT_SAID: ${{ fromJSON(inputs.request).agent_said }}
  FIX_EXPECTED: ${{ fromJSON(inputs.request).expected }}
  FIX_FIRST_TRY: ${{ inputs.first }}
  OWNER_NAME: ${{ vars.OWNER_NAME }}

jobs:
  change:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.request).issue != '' && fromJSON(inputs.request).scope == 'code' && 60 || 25 }}
    permissions:
      contents: read
      issues: read
      pull-requests: read # the earlier proposals for the same rule or issue
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
      answer: ${{ steps.agent.outputs.structured_output }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }} # the commit of the dispatch, for both tries
          fetch-depth: 0 # the agent reads what changed after the version of the call
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false # a secret or a write permission: no cache, because other code can write an entry
      - run: uv sync --frozen

      - name: Read the issue
        if: env.FIX_ISSUE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$FIX_ISSUE" in *[!0-9]*) echo "::error::The input issue is not a number."; exit 1 ;; esac
          gh api "repos/${GITHUB_REPOSITORY}/issues/${FIX_ISSUE}" > "$RUNNER_TEMP/issue.json"
          echo "FIX_ISSUE_FILE=$RUNNER_TEMP/issue.json" >> "$GITHUB_ENV"

      # An earlier coding agent wrote the titles and the diffs. They go to the task through files, and code
      # picks the pull requests and cuts each part to a fixed length (`proposal earlier`, `earlier_text`).
      - name: Read the earlier proposals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/earlier"
          # The 100 newest pull requests of the repository, in each state.
          gh api "repos/${GITHUB_REPOSITORY}/pulls?state=all&sort=created&direction=desc&per_page=100" > "$RUNNER_TEMP/earlier/pulls.json"
          numbers="$(uv run proposal earlier --pulls "$RUNNER_TEMP/earlier/pulls.json")"
          for number in $numbers; do
            case "$number" in *[!0-9]*) echo "::error::A pull request number is not a number."; exit 1 ;; esac
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}/files?per_page=30" > "$RUNNER_TEMP/earlier/${number}.json"
          done
          echo "FIX_EARLIER_DIR=$RUNNER_TEMP/earlier" >> "$GITHUB_ENV"

      # For the second try, the task has a section on the first try. The facts of the first try stay in files.
      - name: Check the fix request and write the task
        id: task
        run: |
          uv run proposal task --out "$RUNNER_TEMP/task.md" >> "$GITHUB_STEP_SUMMARY"
          {
            echo 'text<<END_OF_TASK_7c1e52'
            cat "$RUNNER_TEMP/task.md"
            echo
            echo 'END_OF_TASK_7c1e52'
            echo "schema=$(uv run proposal schema)"
          } >> "$GITHUB_OUTPUT"

      - name: Read the first try
        if: inputs.try == 2
        uses: actions/download-artifact@v4
        with:
          pattern: "*-1" # change-1 and measure-1, one folder each
          path: ${{ runner.temp }}/first

      # The last `uv run` before the agent: after its `git apply`, the command imports no module of the
      # checkout. The runner of the first measure ran the first change, so its facts are data, cut to a length.
      - name: Start from the first change
        if: inputs.try == 2
        run: uv run proposal first-try --tries "$RUNNER_TEMP/first" --out .first-try

      - name: Check the login of the coding agent
        id: login
        uses: ./.github/actions/agent-login
        with:
          token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: The coding agent makes one change
        id: agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ steps.login.outputs.token }}
          # Claude Code uses an API key before a subscription token. So the key is given only when there is no token.
          anthropic_api_key: ${{ !secrets.CLAUDE_CODE_OAUTH_TOKEN && secrets.ANTHROPIC_API_KEY || '' }}
          github_token: ${{ github.token }}
          # The queue starts improve.yml with the token of its own run, so the actor is the bot of GitHub Actions.
          # The action refuses a run that a bot started, unless the bot is named here. Only a workflow of this
          # repository with the permission `actions: write` can start a run as this bot (issues.yml, triage.yml).
          allowed_bots: "github-actions[bot]"
          prompt: ${{ steps.task.outputs.text }}
          claude_args: |
            --model ${{ env.FIX_SCOPE == 'code' && vars.BUILD_MODEL || vars.IMPROVE_MODEL || 'claude-opus-5-5' }}
            --max-turns ${{ env.FIX_SCOPE == 'code' && '150' || '40' }}
            --permission-mode acceptEdits
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(uv run pytest:*),Bash(uv run score-harness),Bash(uv run python .claude/skills/formal-verify-caller-memory/check.py),Bash(git log:*),Bash(git diff:*),Bash(git show:*)"
            --disallowedTools "WebFetch,WebSearch"
            --json-schema '${{ steps.task.outputs.schema }}'

      # The action hides what the coding agent printed. This step shows only the end result: the error text of a
      # refused login or a reached usage limit is there. It holds no secret.
      - name: Why the coding agent failed
        if: failure() && steps.agent.conclusion == 'failure'
        run: |
          file="$RUNNER_TEMP/claude-execution-output.json"
          if [ ! -f "$file" ]; then echo "The coding agent wrote no output file." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          jq -rs 'flatten | .[] | if .type == "result" then "result: \(.subtype), error: \(.is_error), turns: \(.num_turns)\n\((.result // "") | tostring | .[0:800])" elif (.type == "assistant" and .error != null) then "error of the model request: \(.error)" else empty end' "$file" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Make a patch of the change
        id: patch
        run: |
          # Only src, tests and evals go into the patch; for the scope `code`, README.md too. So `.first-try/` never does.
          # The next job refuses a file that the agent must not change.
          paths=(src tests evals)
          if [ "$FIX_SCOPE" = code ]; then paths+=(README.md); fi
          git add -A -- "${paths[@]}"
          git diff --cached --binary HEAD > "$RUNNER_TEMP/change.patch"
          if [ ! -s "$RUNNER_TEMP/change.patch" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [ "$FIX_TRY" = 2 ] && cmp -s "$RUNNER_TEMP/change.patch" "$RUNNER_TEMP/first/change-1/change.patch"; then
            # The second agent left the first change as it was. A second measure would only repeat the first.
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Nothing to propose
        if: steps.patch.outputs.changed != 'true'
        run: echo "The coding agent gave no new change in this try." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.patch.outputs.changed == 'true'
        with:
          name: change-${{ inputs.try }}
          path: ${{ runner.temp }}/change.patch
          retention-days: 14

  # The "before" result of the existing made-up calls. The old code is the same for both tries, and for each fix job
  # at the same code state. So this job stores the result, and a later job uses it again.
  # This job runs only clean code of the commit: no patch and no artifact of the agent. The jobs `change` and
  # `measure` run the agent's code. Code there can upload an artifact with any name, and anybody can read the
  # list of the artifacts. So the stored result is a signed file (`proposal baseline-sign`):
  #   - the signature is an HMAC, with the salt IMPROVE_BASELINE_SALT, of the code state and of the file.
  #     Only three steps of this job get the salt: name, open, sign. The step that runs the scorer does not.
  #   - `proposal baseline-open` reads the file with Python's zipfile, and no tool unpacks the artifact. It ignores
  #     a file with a bad signature, of another code state, too large, or with another name. Then the scorer runs.
  #   - this job restores no uv cache: an entry that other code wrote can write each file on this runner.
  # With no salt, no API key, or IMPROVE_SCORE_CALLS other than `all`, it does nothing. Then `measure` runs each call.
  baseline:
    if: (vars.IMPROVE_SCORE_CALLS || 'all') == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # list and download the artifacts of the stored result
    # The result goes to the job `measure` as job outputs, not as an artifact: code of the job `change` can upload
    # an artifact with any name, but only this job can set these values. `result` is one JSON line of at most
    # 100,000 bytes, with only what `proposal baseline-merge` reads. Empty: `measure` runs each made-up call.
    outputs:
      found: ${{ steps.open.outputs.result != '' && 'hit' || steps.sign.outputs.result != '' && 'miss' || '' }}
      result: ${{ steps.open.outputs.result || steps.sign.outputs.result }}
    env:
      # The same model as the step "Score before the change and after it". A test checks that the two lines are equal.
      LLM_MODEL: ${{ vars.IMPROVE_SCORE_MODEL || 'anthropic:claude-haiku-5-5' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }} # the commit that the agent changes
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - run: uv sync --frozen

      # The state comes from git's own hashes of the inputs, each setting of the scorer, and a format number.
      # The name of the stored result is an HMAC of the state. The name and the state are not secret.
      - name: Name the stored result
        id: key
        env:
          BASELINE_SALT: ${{ secrets.IMPROVE_BASELINE_SALT }}
          HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_API_KEY" != "true" ]; then
            echo "No secret ANTHROPIC_API_KEY, so no made-up call runs, and no result is stored."
            exit 0
          fi
          uv run proposal baseline-key

      # The 5 newest artifacts with the exact name, each below 1 MB, as zip files outside the checkout.
      # A failed list or download is no stored result: then the scorer runs.
      - name: Find the stored result
        if: steps.key.outputs.name != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.key.outputs.name }}
        run: |
          set -euo pipefail
          zips="$RUNNER_TEMP/store-zips"
          mkdir -p "$zips"
          if ! ids="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${NAME}&per_page=20" \
            --jq '[.artifacts[] | select(.expired == false and .size_in_bytes < 1000000)] | sort_by(.created_at, .id) | reverse | .[:5] | .[].id')"; then
            echo "The list of the artifacts failed, so the job uses no stored result."
            exit 0
          fi
          n=0
          for id in $ids; do
            case "$id" in *[!0-9]*) continue ;; esac
            n=$((n + 1))
            # The file name gives the order: 1.zip is the newest.
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "$zips/$n.zip" || rm -f "$zips/$n.zip"
          done
          echo "Artifacts with the name of the stored result: $n."

      # The first file with a good signature, of this code state, and with the right form. Else no stored result.
      - name: Open the stored result
        id: open
        if: steps.key.outputs.name != ''
        continue-on-error: true
        env:
          BASELINE_SALT: ${{ secrets.IMPROVE_BASELINE_SALT }}
          BASELINE_STATE: ${{ steps.key.outputs.state }}
        run: uv run proposal baseline-open --zips "$RUNNER_TEMP/store-zips" >> "$GITHUB_STEP_SUMMARY"

      # The paid run: each existing made-up call, on the clean code. Its failure does not fail the try.
      # Then the job `measure` runs each made-up call before the change. A test checks that the settings of this
      # step and of the step "Score before the change and after it" are equal.
      - name: Run the existing made-up calls on the clean code
        id: score
        if: steps.key.outputs.name != '' && steps.open.outputs.found != 'hit'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run score-harness --calls --out "$RUNNER_TEMP/scored.json"

      - name: Sign the result
        id: sign
        if: steps.score.outcome == 'success'
        continue-on-error: true
        env:
          BASELINE_SALT: ${{ secrets.IMPROVE_BASELINE_SALT }}
          BASELINE_STATE: ${{ steps.key.outputs.state }}
        run: uv run proposal baseline-sign --result "$RUNNER_TEMP/scored.json" --out "$RUNNER_TEMP/store/store.json" >> "$GITHUB_STEP_SUMMARY"

      # The name of an artifact is unique in one run. When a job of this run uploaded the name first, this upload
      # fails, and that must not fail the job. The next fix job at the same code state then runs the calls again.
      - name: Store the result for 30 days
        if: steps.sign.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.key.outputs.name }}
          path: ${{ runner.temp }}/store/store.json
          if-no-files-found: error
          retention-days: 30

  measure:
    needs: [change, baseline]
    # `!cancelled()`: a skipped or failed job `baseline` must not skip this job. Then the scorer runs each made-up call before the change.
    if: ${{ !cancelled() && needs.change.result == 'success' && needs.change.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45 # the made-up calls with a changed check run 4 more times
    permissions:
      contents: read
      issues: read
    outputs:
      finished: ${{ steps.body.outcome == 'success' }}
      verdict: ${{ steps.body.outputs.verdict }}
      calls: ${{ steps.body.outputs.calls }}
      # red, not-red or no-test: did a new or changed test fail on the old code (`proposal red`)
      red: ${{ steps.proof.outputs.red }}
      # The result of each step that can stop the job, so that the report can say which one did.
      guard: ${{ steps.guard.outcome }}
      proof: ${{ steps.proof.outcome }}
      tests: ${{ steps.tests.outcome }}
      formal: ${{ steps.formal.outcome }}
      score: ${{ steps.score.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }} # the same commit that the agent changed
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false # a secret or a write permission: no cache, because other code can write an entry
      - run: uv sync --frozen
      - uses: actions/download-artifact@v4
        with:
          name: change-${{ inputs.try }}
          path: ${{ runner.temp }}

      # The runner of the job `change` ran the agent's commands, so this job reads the issue again from GitHub.
      - name: Read the issue
        if: env.FIX_ISSUE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$FIX_ISSUE" in *[!0-9]*) echo "::error::The input issue is not a number."; exit 1 ;; esac
          gh api "repos/${GITHUB_REPOSITORY}/issues/${FIX_ISSUE}" > "$RUNNER_TEMP/issue.json"
          echo "FIX_ISSUE_FILE=$RUNNER_TEMP/issue.json" >> "$GITHUB_ENV"

      - name: Check the patch, then apply it
        id: guard
        run: uv run proposal guard --patch "$RUNNER_TEMP/change.patch"

      # The scorer runs only the text mode, so for a change of code a test is the only measure. A test that
      # passes on the old code too proves nothing. This step puts back the old src/ for a moment, runs the
      # new and changed test files, then puts the change back. Its result does not stop the job.
      - name: A new test fails on the old code
        id: proof
        run: uv run proposal red

      # A second try reads the end of this output (`proposal first-try`).
      - name: Unit tests
        id: tests
        run: |
          set -o pipefail
          uv run pytest -q 2>&1 | tee "$RUNNER_TEMP/pytest.txt"

      # A change of code can change how the line knows a caller. The search runs the real functions; it makes no model request.
      - name: Formal check of caller memory
        id: formal
        if: env.FIX_SCOPE == 'code'
        run: uv run python .claude/skills/formal-verify-caller-memory/check.py

      - name: Score before the change and after it
        id: score
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # The agents of a made-up call run on a small model. Each request sends the full prompt of an agent,
          # 3,100 to 5,900 tokens, and one scorer run makes about 125 requests. On claude-opus-5-5 that was
          # about 3 dollars for one scorer run, and one try runs the scorer two times or more.
          LLM_MODEL: ${{ vars.IMPROVE_SCORE_MODEL || 'anthropic:claude-haiku-5-5' }}
          SCORE_CALLS: ${{ vars.IMPROVE_SCORE_CALLS || 'all' }}
          NEW_CALLS: ${{ steps.guard.outputs.new_calls }}
          # The outputs of the job `baseline`. Only that job can set them. `proposal baseline-merge` checks them.
          BASELINE_RESULT: ${{ needs.baseline.outputs.result }}
          BASELINE_FOUND: ${{ needs.baseline.outputs.found }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ] && [ "$SCORE_CALLS" != "none" ]; then
            echo "No secret ANTHROPIC_API_KEY, so the scorer ran no made-up call. The scores are from the code checks only." >> "$GITHUB_STEP_SUMMARY"
            SCORE_CALLS=none
          fi
          new_flags=()
          if [ -n "$NEW_CALLS" ]; then
            new_flags+=(--calls)
            for id in $NEW_CALLS; do new_flags+=(--only "$id"); done
          fi
          flags=()
          case "$SCORE_CALLS" in
            all) flags+=(--calls) ;;
            new) flags=("${new_flags[@]}") ;;
            none) ;;
            *) echo "IMPROVE_SCORE_CALLS must be all, new or none"; exit 1 ;;
          esac
          # The job `baseline` ran the existing made-up calls on clean code. With its result, the run before the change
          # takes only the new made-up calls and the word list. With a bad result, each made-up call runs.
          if [ -n "${BASELINE_RESULT:-}" ]; then
            mkdir -p "$RUNNER_TEMP/baseline"
            printf '%s\n' "$BASELINE_RESULT" > "$RUNNER_TEMP/baseline/baseline.json"
            printf '%s\n' "${BASELINE_FOUND:-}" > "$RUNNER_TEMP/baseline/found.txt"
          fi
          before_flags=("${flags[@]}")
          stored=""
          if [ "$SCORE_CALLS" = all ] && [ -f "$RUNNER_TEMP/baseline/baseline.json" ]; then
            if uv run proposal baseline-merge --baseline "$RUNNER_TEMP/baseline/baseline.json" --found "$RUNNER_TEMP/baseline/found.txt"; then
              stored=yes
              before_flags=("${new_flags[@]}")
            else
              echo "The stored \"before\" result of the job \`baseline\` cannot be used, so each made-up call ran before the change." >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [ "$SCORE_CALLS" = all ]; then
            echo "The job \`baseline\` gave no stored \"before\" result, so each made-up call ran before the change." >> "$GITHUB_STEP_SUMMARY"
          fi
          # Before: the old prompts and word lists, with the new made-up call. So the two scores have the same checks.
          git diff HEAD -- src tests > "$RUNNER_TEMP/code.patch"
          if [ -s "$RUNNER_TEMP/code.patch" ]; then git apply -R "$RUNNER_TEMP/code.patch"; fi
          uv run score-harness "${before_flags[@]}" --out "$RUNNER_TEMP/before.json"
          if [ -n "$stored" ]; then
            uv run proposal baseline-merge --baseline "$RUNNER_TEMP/baseline/baseline.json" --found "$RUNNER_TEMP/baseline/found.txt" --before "$RUNNER_TEMP/before.json"
          fi
          if [ -s "$RUNNER_TEMP/code.patch" ]; then git apply "$RUNNER_TEMP/code.patch"; fi
          uv run score-harness "${flags[@]}" --out "$RUNNER_TEMP/after.json"
          # One run can flip a check with no cause. Each made-up call with a changed check runs 2 more times
          # on each side, and the majority of 3 decides. Only when the made-up calls ran: the word list gives
          # the same result each time.
          uv run proposal again --before "$RUNNER_TEMP/before.json" --after "$RUNNER_TEMP/after.json"

      - name: Write the pull request text
        id: body
        env:
          RED: ${{ steps.proof.outputs.red }}
          AGENT_ANSWER: ${{ needs.change.outputs.answer }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # The stored "before" result of the existing made-up calls. `proposal body` takes each value only in its fixed form.
          STORED: ${{ steps.score.outputs.stored }}
          STORED_MADE: ${{ steps.score.outputs.made }}
          STORED_COMMIT: ${{ steps.score.outputs.commit }}
        run: |
          uv run proposal body --before "$RUNNER_TEMP/before.json" --after "$RUNNER_TEMP/after.json" --out "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: The score got worse
        if: steps.body.outputs.verdict == 'worse'
        run: echo "A check that passed before the change now fails. This try can open no pull request." >> "$GITHUB_STEP_SUMMARY"

      # Also after a failed step: the job `push` takes the pull request text from here, and a second try reads
      # what this try showed. None of it runs on another runner; code there reads it as data.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measure-${{ inputs.try }}
          path: |
            ${{ runner.temp }}/before.json
            ${{ runner.temp }}/after.json
            ${{ runner.temp }}/body.md
            ${{ runner.temp }}/pytest.txt
          if-no-files-found: ignore
          retention-days: 14
